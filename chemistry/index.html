<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>化學專業英文 AI 自主學習</title>
<meta name="description" content="將《科學專業英文(化學)》PDF 詞彙表轉換成可離線使用的自主學習 App：單字卡、發音、練習、測驗、遊戲、智慧複習與學習儀表板。">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<a class="skip" href="#view" id="skip-link">跳到主要內容</a>
<div id="frame">
  <div class="device-badge" id="device-badge" role="status"></div>
  <header class="top">
    <a class="brand" href="#/" aria-label="回首頁">
      <img src="icons/icon-192.png" alt="">
      <span id="brand-title">化學專業英文</span>
    </a>
    <span class="spacer"></span>
    <form class="search-top" id="search-form" role="search">
      <label class="sr-only" for="search-input" id="search-label">全文搜尋</label>
      <input id="search-input" type="search" placeholder="搜尋單字、中文、例句…" autocomplete="off">
    </form>
    <a class="icon-btn" id="hub-link" href="../index.html" aria-label="回到科目總覽" title="回到科目總覽（五科首頁）">🏫</a>
    <span class="net" id="net-status" role="status" aria-live="polite">線上</span>
    <button class="icon-btn" id="btn-search-m" type="button" aria-label="搜尋">🔍</button>
    <button class="icon-btn" id="btn-settings" type="button" aria-label="顯示與操作設定" aria-haspopup="dialog">⚙️</button>
  </header>
  <div class="layout">
    <nav class="side" id="side-nav" aria-label="主選單"></nav>
    <div class="content">
    <nav id="crumbs" class="crumbs" aria-label="麵包屑"></nav>
    <main id="view" tabindex="-1">
      <noscript><p>這個 App 需要啟用 JavaScript 才能使用。</p></noscript>
      <p id="boot-msg">載入教材中…</p>
    </main>
    </div>
  </div>
  <nav class="tabbar" id="tab-nav" aria-label="快速選單"></nav>
  <footer class="bottom" id="footer"></footer>
</div>
<div class="toast-box" id="toasts" aria-live="polite"></div>
<dialog id="dlg" aria-labelledby="dlg-title"></dialog>
<script type="module" src="js/app.js"></script>
</body>
</html>
